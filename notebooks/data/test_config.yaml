global:
  res_dir: skalowcore_1h_allsats_FoV4d
  input_spectra: ./inputs/spectra_dataset.pkl
  use_no_flux: False
  keep_zarr: True
  keep_ms: False
  total_bandwidth: 8e6 #in Hz


satcat_sampling:
  constellations: [starlink_filing1, starlink_filing2]
  ndec: 1800
  nra: 3600
  npoints: 2000
  dt: 5.0
  Lfov: 4.0
  seed: 1001

imaging_params:
  u_max: 1000 #Maximum baseline to form the image (in lambda). Put None to ignore.
  baseline_step: 1
  cal_column: CAL_DATA
  rfi_column: RFI_MODEL_DATA
  fov_deg: 4
  dx_arcsec: 30.0

ps_params:
  u_min: 38
  u_max: 1000

telescope:
  name: SKA-Low-AA*-2000m

observation:
  target_name: target
  ra: 27.0
  dec: -30.0
  start_time_lha: 0.0 #deg
  int_time: 10.0
  n_time: 360 #so this is 1 hour of observation with 10s integration time
  n_int: 200
  start_freq: 157e6
  chan_width: 1e5
  n_freq: 1
  SEFD: 1610 #is 1470/sqrt(12.5) -> corresponds to 12.5 time the observational time.
  auto_corrs: False
  no_w: False
  random_seed: 2001

ast_sources:
  point:
    random: 
      n_src: 0
      min_I: 10sigma
      max_I: 1.0
      I_pow_law: 1.6
      si_mean: 0.7
      si_std: 0.2
      n_beam: 5.0
      max_sep: 200.0 # arcseconds
      random_seed: 123456

gains:
  G0_mean: 1.0
  G0_std: 0.05
  Gt_std_amp: 1e-5
  Gt_std_phase: 1e-3
  random_seed: 999

output:
  path: /capstor/scratch/cscs/ncerardi/project_rfiskalow/results/skalowcore_1h_allsats_FoV1d
  prefix: SKALowAAstar
  overwrite: True
  zarr: True
  ms: False
  save_arrays: ['noise_data', 'bl_uvw', 'vis_calibrated', 'vis_rfi']

diagnostics:
  uv_cov: True
  src_alt: False
  rfi_seps: False

dask:
  max_chunk_MB: 100.0